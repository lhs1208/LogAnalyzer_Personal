app:
  description: 단건 로그 분석 / 일일 운영보고 / 실시간 이상감지 / 일간 취합 / 월간 운영보고를 mode 파라미터로 분기 처리하는
    통합 워크플로우 / Java Ping 생존확인 모드 추가 / 폐쇄망 Qwen3.5-122B / MCP 미사용 / 결과 반환 전용
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: logSuite_integrated_20261004_Qwen_offline
  use_icon_as_answer_icon: false
dependencies: []
kind: app
site:
