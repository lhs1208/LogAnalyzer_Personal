        code: "def main(mode: str, sa_is_fault, sa_summary, sa_severity, dr_report_text,\n\
          \         an_message, err_message, do_result, da_result, ss_result,\n  \
          \       mr_result, mo_result, ma_result, ms_result) -> dict:\n    import\
          \ json\n\n    title_map = {\n        \"single_analyze\": \"[LogSuite] 단건\
          \ 로그분석 결과\",\n        \"daily_report\": \"[LogSuite] 일일 운영보고\",\n      \
          \  \"anomaly\": \"[LogSuite] 실시간 이상감지\",\n        \"daily_optimization\"\
          : \"[LogSuite] 일간 최적화 인사이트\",\n        \"daily_anomaly\": \"[LogSuite] 일간\
          \ 이상감지 취합\",\n        \"daily_single_analyze\": \"[LogSuite] 일간 단건분석 취합\"\
          ,\n        \"monthly_report\": \"[LogSuite] 월간 운영보고\",\n        \"monthly_optimization\"\
          : \"[LogSuite] 월간 최적화 인사이트\",\n        \"monthly_anomaly\": \"[LogSuite]\
          \ 월간 이상감지 취합\",\n        \"monthly_single_analyze\": \"[LogSuite] 월간 단건분석\
          \ 취합\",\n    }\n\n    body_map = {\n        \"single_analyze\": (f\"[fault={sa_is_fault}]\
          \ [{sa_severity}] {sa_summary}\" if sa_summary else \"\"),\n        \"daily_report\"\
          : dr_report_text or \"\",\n        \"anomaly\": an_message or \"\",\n  \
          \      \"daily_optimization\": do_result or \"\",\n        \"daily_anomaly\"\
          : da_result or \"\",\n        \"daily_single_analyze\": ss_result or \"\"\
          ,\n        \"monthly_report\": mr_result or \"\",\n        \"monthly_optimization\"\
          : mo_result or \"\",\n        \"monthly_anomaly\": ma_result or \"\",\n\
          \        \"monthly_single_analyze\": ms_result or \"\",\n    }\n\n    title\
          \ = title_map.get(mode, \"[LogSuite] 처리 결과\")\n    body = body_map.get(mode,\
          \ \"\")\n    if not body and err_message:\n        title = \"[LogSuite]\
          \ 처리 오류\"\n        body = err_message\n\n    # 내부 쪽지 시스템의 본문 길이 제한을 고려해\
          \ 적당히 자른다 (실제 시스템 한도에 맞게 조정 필요)\n    MAX_LEN = 1500\n    if len(body) >\
          \ MAX_LEN:\n        body = body[:MAX_LEN] + \"\\n...(이하 생략, 전체 내용은 원본 응답\
          \ 참조)\"\n\n    if not body:\n        body = f\"결과 내용이 비어 있습니다. (모드: {mode})\"\
          \n\n    return {\n        \"message_title\": title,\n        \"message_text\"\
          : body,\n    }\n"
