    - data:
        code: "def main(cur_error_count, cur_warn_count, cur_timeout_count, cur_http5xx_count,\n\
          \         cur_db_conn_count, cur_login_fail_count, cur_batch_fail_count,\
          \ cur_external_api_fail_count,\n         has_critical, critical_hit_text,\n\
          \         prev_error_count, prev_warn_count, prev_timeout_count, prev_http5xx_count,\n\
          \         prev_db_conn_count, prev_login_fail_count, prev_batch_fail_count,\
          \ prev_external_api_fail_count) -> dict:\n\n    ABS_FLOOR = 5\n    WARN_ABS_FLOOR\
          \ = 10  # WARN은 평소에도 자주 발생하는 편이라 다른 항목보다 절대 임계치를 높게 잡는다.\n    DELTA_THRESHOLD\
          \ = 3\n\n    # (이름, 현재값, 직전값, 심각도, 절대임계치)\n    checks = [\n        (\"ERROR\"\
          , cur_error_count, prev_error_count, \"높음\", ABS_FLOOR),\n        (\"Timeout\"\
          , cur_timeout_count, prev_timeout_count, \"높음\", ABS_FLOOR),\n        (\"\
          HTTP 5xx\", cur_http5xx_count, prev_http5xx_count, \"높음\", ABS_FLOOR),\n\
          \        (\"DB Connection\", cur_db_conn_count, prev_db_conn_count, \"높음\"\
          , ABS_FLOOR),\n        (\"외부 API 실패\", cur_external_api_fail_count, prev_external_api_fail_count,\
          \ \"높음\", ABS_FLOOR),\n        (\"로그인 실패\", cur_login_fail_count, prev_login_fail_count,\
          \ \"보통\", ABS_FLOOR),\n        (\"배치 실패\", cur_batch_fail_count, prev_batch_fail_count,\
          \ \"보통\", ABS_FLOOR),\n        (\"WARN\", cur_warn_count, prev_warn_count,\
          \ \"보통\", WARN_ABS_FLOOR),\n    ]\n\n    # prev_* 기본값이 모두 0인 최초 호출에서는 '0\
          \ -> 3' 같은 작은 변화만으로\n    # 이상으로 오판하지 않고, 절대 임계치 또는 치명적 패턴만 적용한다.\n    prev_values\
          \ = [\n        prev_error_count, prev_warn_count, prev_timeout_count, prev_http5xx_count,\n\
          \        prev_db_conn_count, prev_login_fail_count, prev_batch_fail_count,\
          \ prev_external_api_fail_count,\n    ]\n    first_baseline = all((value\
          \ or 0) == 0 for value in prev_values)\n\n    reasons = []\n    severities\
          \ = []\n\n    for name, cur, prev, level, abs_floor in checks:\n       \
          \ cur = cur or 0\n        prev = prev or 0\n        delta = cur - prev\n\
          \        hit_absolute = cur >= abs_floor\n        hit_delta = (not first_baseline)\
          \ and delta >= DELTA_THRESHOLD\n\n        if hit_absolute or hit_delta:\n\
          \            if hit_absolute and hit_delta:\n                detail = f\"\
          {name} {prev}건 -> {cur}건 (직전 대비 +{delta}건, 절대 임계치 {abs_floor}건 이상)\"\n \
          \           elif hit_delta:\n                detail = f\"{name} {prev}건\
          \ -> {cur}건 (직전 대비 +{delta}건)\"\n            else:\n                detail\
          \ = f\"{name} 현재 {cur}건 (절대 임계치 {abs_floor}건 이상)\"\n            reasons.append(detail)\n\
          \            severities.append(level)\n\n    if has_critical == \"true\"\
          :\n        severities.append(\"치명적\")\n        reasons.append(f\"치명적 패턴\
          \ 감지: {critical_hit_text}\")\n\n    severity_order = [\"치명적\", \"높음\", \"\
          보통\", \"낮음\"]\n    final_severity = min(severities, key=lambda s: severity_order.index(s))\
          \ if severities else \"낮음\"\n\n    anomaly_detected = \"true\" if reasons\
          \ else \"false\"\n    reasons_text = \"\\n\".join(reasons) if reasons else\
          \ \"특이사항 없음\"\n\n    return {\n        \"anomaly_detected\": anomaly_detected,\n\
          \        \"severity\": final_severity,\n        \"reasons_text\": reasons_text,\n\
          \    }\n"
        code_language: python3
        desc: 대화 변수에 저장된 직전 건수 대비 이번 건수의 증가 여부로 이상징후를 판단한다
        outputs:
          anomaly_detected:
            type: string
          reasons_text:
            type: string
          severity:
            type: string
