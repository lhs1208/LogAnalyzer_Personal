            날 반복된 오류/경고/이상 패턴", "items": {"type": "string"}, "type": "array"}, "report_text":
            {"description": "지정된 Markdown 형식으로 작성된 전체 월간 운영보고서", "type": "string"},
            "trend_summary": {"description": "월간 변화 추이 및 집중 시기 요약", "type": "string"}},
            "required": ["overall_status", "monthly_summary", "major_issues", "recurring_patterns",
            "trend_summary", "recommendations", "report_text"], "type": "object"}'
