    - data:
        code: "def main(daily_results_json: str) -> dict:\n    import json\n    import\
          \ re\n    from datetime import datetime\n\n    raw = (daily_results_json\
          \ or \"\").strip()\n    empty = {\n        \"has_data\": \"false\", \"status\"\
          : \"empty\", \"error_detail\": \"\",\n        \"day_count\": 0, \"unique_day_count\"\
          : 0, \"duplicate_day_count\": 0,\n        \"invalid_date_count\": 0, \"\
          period_start\": \"\", \"period_end\": \"\",\n        \"data_quality_summary\"\
          : \"입력 데이터 없음\", \"records_text\": \"\"\n    }\n    if not raw:\n      \
          \  return empty\n\n    try:\n        records = json.loads(raw)\n       \
          \ if not isinstance(records, list):\n            records = [records]\n \
          \   except Exception as e:\n        result = dict(empty)\n        result.update({\"\
          status\": \"error\", \"error_detail\": str(e).replace('\"', \"'\").replace(\"\
          \\n\", \" \")[:300],\n                       \"data_quality_summary\": \"\
          JSON 파싱 오류\"})\n        return result\n\n    if not records:\n        return\
          \ empty\n\n    date_re = re.compile(r\"^\\d{4}-\\d{2}-\\d{2}$\")\n    valid_dates\
          \ = []\n    invalid_date_count = 0\n    for rec in records:\n        if\
          \ not isinstance(rec, dict):\n            invalid_date_count += 1\n    \
          \        continue\n        day = str(rec.get(\"date\") or rec.get(\"day\"\
          ) or \"\").strip()\n        if not date_re.match(day):\n            invalid_date_count\
          \ += 1\n            continue\n        try:\n            datetime.strptime(day,\
          \ \"%Y-%m-%d\")\n            valid_dates.append(day)\n        except Exception:\n\
          \            invalid_date_count += 1\n\n    unique_dates = sorted(set(valid_dates))\n\
          \    duplicate_day_count = max(0, len(valid_dates) - len(unique_dates))\n\
          \    period_start = unique_dates[0] if unique_dates else \"\"\n    period_end\
          \ = unique_dates[-1] if unique_dates else \"\"\n\n    def sort_key(rec):\n\
          \        if isinstance(rec, dict):\n            return str(rec.get(\"date\"\
          ) or rec.get(\"day\") or rec.get(\"timestamp\") or \"\")\n        return\
          \ \"\"\n\n    try:\n        records = sorted(records, key=sort_key)\n  \
          \  except Exception:\n        pass\n\n    blocks = []\n    for i, rec in\
          \ enumerate(records, 1):\n        if isinstance(rec, dict):\n          \
          \  day = rec.get(\"date\") or rec.get(\"day\") or rec.get(\"timestamp\"\
          ) or f\"{i}일차\"\n            lines = [f\"[{i}] 일자: {day}\"]\n          \
          \  preferred = [\"report_text\", \"daily_report\", \"optimization\", \"\
          anomaly\", \"single_analyze\"]\n            used = set()\n            for\
          \ k in preferred:\n                if k in rec and rec.get(k) not in (None,\
          \ \"\", [], {}):\n                    v = rec.get(k)\n                 \
          \   if isinstance(v, (dict, list)):\n                        v = json.dumps(v,\
          \ ensure_ascii=False)\n                    lines.append(f\"  - {k}: {str(v)[:1800]}\"\
          )\n                    used.add(k)\n            for k, v in rec.items():\n\
          \                if k in used or k in (\"date\", \"day\", \"timestamp\"\
          ) or v in (None, \"\", [], {}):\n                    continue\n        \
          \        if isinstance(v, (dict, list)):\n                    v = json.dumps(v,\
          \ ensure_ascii=False)\n                lines.append(f\"  - {k}: {str(v)[:600]}\"\
          )\n            blocks.append(\"\\n\".join(lines)[:3500])\n        else:\n\
          \            blocks.append(f\"[{i}] {str(rec)[:3500]}\")\n\n    records_text\
          \ = \"\\n\\n\".join(blocks)\n    if len(records_text) > 30000:\n       \
          \ records_text = records_text[:30000] + f\"\\n...(이하 생략, 총 {len(records)}건\
          \ 중 일부 내용은 축약됨)\"\n\n    quality_parts = [f\"입력 {len(records)}건\", f\"유효\
          \ 일자 {len(unique_dates)}일\"]\n    if duplicate_day_count:\n        quality_parts.append(f\"\
          중복 일자 {duplicate_day_count}건\")\n    if invalid_date_count:\n        quality_parts.append(f\"\
          날짜 확인 필요 {invalid_date_count}건\")\n    data_quality_summary = \" / \".join(quality_parts)\n\
          \n    return {\n        \"has_data\": \"true\", \"status\": \"ok\", \"error_detail\"\
          : \"\",\n        \"day_count\": len(records), \"unique_day_count\": len(unique_dates),\n\
          \        \"duplicate_day_count\": duplicate_day_count, \"invalid_date_count\"\
          : invalid_date_count,\n        \"period_start\": period_start, \"period_end\"\
          : period_end,\n        \"data_quality_summary\": data_quality_summary, \"\
          records_text\": records_text\n    }\n"
