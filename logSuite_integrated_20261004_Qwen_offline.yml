    - data:
        code: "def main(hourly_single_analyze_json: str) -> dict:\n    import json\n\
          \    from collections import Counter\n\n    raw = (hourly_single_analyze_json\
          \ or \"\").strip()\n\n    if not raw:\n        return {\"has_data\": \"\
          false\", \"status\": \"empty\", \"error_detail\": \"\",\n              \
          \  \"hour_count\": 0, \"fault_hour_count\": 0,\n                \"severity_summary_text\"\
          : \"\", \"records_text\": \"\"}\n\n    try:\n        records = json.loads(raw)\n\
          \        if not isinstance(records, list):\n            records = [records]\n\
          \    except Exception as e:\n        return {\"has_data\": \"false\", \"\
          status\": \"error\",\n                \"error_detail\": str(e).replace('\"\
          ', \"'\").replace(\"\\n\", \" \")[:300],\n                \"hour_count\"\
          : 0, \"fault_hour_count\": 0,\n                \"severity_summary_text\"\
          : \"\", \"records_text\": \"\"}\n\n    if not records:\n        return {\"\
          has_data\": \"false\", \"status\": \"empty\", \"error_detail\": \"\",\n\
          \                \"hour_count\": 0, \"fault_hour_count\": 0,\n         \
          \       \"severity_summary_text\": \"\", \"records_text\": \"\"}\n\n   \
          \ def sort_key(rec):\n        if isinstance(rec, dict):\n            return\
          \ str(rec.get(\"timestamp\") or rec.get(\"time\") or rec.get(\"hour\") or\
          \ \"\")\n        return \"\"\n\n    try:\n        records = sorted(records,\
          \ key=sort_key)\n    except Exception:\n        pass\n\n    severity_counter\
          \ = Counter()\n    fault_hours = 0\n    blocks = []\n\n    for i, rec in\
          \ enumerate(records, 1):\n        if not isinstance(rec, dict):\n      \
          \      blocks.append(f\"[{i}] {rec}\")\n            continue\n\n       \
          \ ts = rec.get(\"timestamp\") or rec.get(\"time\") or rec.get(\"hour\")\
          \ or f\"{i}번째\"\n        is_fault = str(rec.get(\"is_fault\", \"\")).lower()\
          \ == \"true\"\n        severity = rec.get(\"severity\") or (\"낮음\" if not\
          \ is_fault else \"확인필요\")\n        summary = rec.get(\"summary\") or \"\"\
          \n\n        if is_fault:\n            fault_hours += 1\n        severity_counter[severity]\
          \ += 1\n\n        blocks.append(\n            f\"[{i}] {ts} | 오류여부: {'예'\
          \ if is_fault else '아니오'} | 심각도: {severity}\\n  요약: {summary}\"\n      \
          \  )\n\n    severity_summary_text = \", \".join(f\"{k}: {v}건\" for k, v\
          \ in severity_counter.items())\n    records_text = \"\\n\\n\".join(blocks)\n\
          \    if len(records_text) > 12000:\n        records_text = records_text[:12000]\
          \ + f\"\\n...(이하 생략, 총 {len(records)}건 중 일부만 표시)\"\n\n    return {\n   \
          \     \"has_data\": \"true\",\n        \"status\": \"ok\",\n        \"error_detail\"\
          : \"\",\n        \"hour_count\": len(records),\n        \"fault_hour_count\"\
          : fault_hours,\n        \"severity_summary_text\": severity_summary_text,\n\
          \        \"records_text\": records_text,\n    }\n"
        code_language: python3
        desc: 하루치 single_analyze 호출 결과(JSON 배열)를 파싱하여 LLM 입력용 텍스트와 통계를 만든다
