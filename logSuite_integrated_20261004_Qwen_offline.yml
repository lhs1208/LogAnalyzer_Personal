    - data:
        code: "def main(hourly_anomaly_json: str) -> dict:\n    import json\n    from\
          \ collections import Counter\n\n    raw = (hourly_anomaly_json or \"\").strip()\n\
          \n    if not raw:\n        return {\"has_data\": \"false\", \"status\":\
          \ \"empty\", \"error_detail\": \"\",\n                \"hour_count\": 0,\
          \ \"anomaly_hour_count\": 0,\n                \"severity_summary_text\"\
          : \"\", \"records_text\": \"\"}\n\n    try:\n        records = json.loads(raw)\n\
          \        if not isinstance(records, list):\n            records = [records]\n\
          \    except Exception as e:\n        return {\"has_data\": \"false\", \"\
          status\": \"error\",\n                \"error_detail\": str(e).replace('\"\
          ', \"'\").replace(\"\\n\", \" \")[:300],\n                \"hour_count\"\
          : 0, \"anomaly_hour_count\": 0,\n                \"severity_summary_text\"\
          : \"\", \"records_text\": \"\"}\n\n    if not records:\n        return {\"\
          has_data\": \"false\", \"status\": \"empty\", \"error_detail\": \"\",\n\
          \                \"hour_count\": 0, \"anomaly_hour_count\": 0,\n       \
          \         \"severity_summary_text\": \"\", \"records_text\": \"\"}\n\n \
          \   def sort_key(rec):\n        if isinstance(rec, dict):\n            return\
          \ str(rec.get(\"timestamp\") or rec.get(\"time\") or rec.get(\"hour\") or\
          \ \"\")\n        return \"\"\n\n    try:\n        records = sorted(records,\
          \ key=sort_key)\n    except Exception:\n        pass\n\n    severity_counter\
          \ = Counter()\n    anomaly_hours = 0\n    blocks = []\n\n    for i, rec\
          \ in enumerate(records, 1):\n        if not isinstance(rec, dict):\n   \
          \         blocks.append(f\"[{i}] {rec}\")\n            continue\n\n    \
          \    ts = rec.get(\"timestamp\") or rec.get(\"time\") or rec.get(\"hour\"\
          ) or f\"{i}번째\"\n        detected = str(rec.get(\"anomaly_detected\", \"\
          \")).lower() == \"true\"\n        severity = rec.get(\"severity\") or (\"\
          낮음\" if not detected else \"확인필요\")\n        reasons = rec.get(\"reasons_text\"\
          ) or rec.get(\"message\") or \"\"\n\n        if detected:\n            anomaly_hours\
          \ += 1\n        severity_counter[severity] += 1\n\n        blocks.append(\n\
          \            f\"[{i}] {ts} | 이상감지: {'예' if detected else '아니오'} | 심각도: {severity}\\\
          n  사유: {reasons}\"\n        )\n\n    severity_summary_text = \", \".join(f\"\
          {k}: {v}건\" for k, v in severity_counter.items())\n    records_text = \"\
          \\n\\n\".join(blocks)\n    if len(records_text) > 12000:\n        records_text\
          \ = records_text[:12000] + f\"\\n...(이하 생략, 총 {len(records)}건 중 일부만 표시)\"\
          \n\n    return {\n        \"has_data\": \"true\",\n        \"status\": \"\
          ok\",\n        \"error_detail\": \"\",\n        \"hour_count\": len(records),\n\
          \        \"anomaly_hour_count\": anomaly_hours,\n        \"severity_summary_text\"\
          : severity_summary_text,\n        \"records_text\": records_text,\n    }\n"
