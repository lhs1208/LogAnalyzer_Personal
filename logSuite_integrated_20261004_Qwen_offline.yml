    - data:
        code: "def main(ping_result: str, source_id: str = \"\") -> dict:\n    value\
          \ = (ping_result or \"\").strip().upper()\n    alive_values = {\"UP\", \"\
          ALIVE\", \"OK\", \"SUCCESS\", \"PONG\", \"TRUE\", \"1\"}\n    dead_values\
          \ = {\"DOWN\", \"DEAD\", \"FAIL\", \"FAILED\", \"TIMEOUT\", \"UNREACHABLE\"\
          , \"FALSE\", \"0\"}\n\n    if value in alive_values:\n        return {\n\
          \            \"ping_status\": \"UP\",\n            \"alive\": \"true\",\n\
          \            \"alert_required\": \"false\",\n            \"alert_message\"\
          : \"\",\n        }\n\n    if value in dead_values:\n        target = source_id\
          \ or \"대상 서버\"\n        return {\n            \"ping_status\": \"DOWN\"\
          ,\n            \"alive\": \"false\",\n            \"alert_required\": \"\
          true\",\n            \"alert_message\": f\"[LogSuite] 서버 생존확인 실패: {target}\
          \ 응답 없음\",\n        }\n\n    return {\n        \"ping_status\": \"UNKNOWN\"\
          ,\n        \"alive\": \"false\",\n        \"alert_required\": \"true\",\n\
          \        \"alert_message\": f\"[LogSuite] 서버 생존확인 결과 확인 필요: {source_id or\
          \ '대상 서버'} / 입력값={value or 'EMPTY'}\",\n    }\n"
        code_language: python3
        desc: Java에서 수행한 Ping/Health Check 결과를 전달받아 서버 생존 여부를 판정한다. UP이면 알림 불필요, DOWN/실패이면
          alert_required=true를 반환한다. LLM은 호출하지 않는다.
        outputs:
          alert_message:
            children: null
            type: string
          alert_required:
            children: null
            type: string
          alive:
            children: null
            type: string
          ping_status:
            children: null
            type: string
