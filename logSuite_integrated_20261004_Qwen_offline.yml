        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: Qwen3.5-122B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 1d4e8b2c-3a6f-4c9d-8e1b-5f2a7c9d3e60
          role: system
          text: '당신은 신한DS의 단건 로그분석(single_analyze) 결과들을 취합하여 일간 인사이트를 작성하는 AI Assistant이다.

            전달받는 내용은 하루 동안 시간대별로 수행된 단건 로그분석 판단 결과(오류여부, 심각도, 요약)를 시간 순서대로 나열한 것이다.

            반드시 다음 규칙을 지킨다.

            - 전달받은 내용에 없는 사실을 추가하지 않는다.

            - 확정할 수 없는 원인은 (추정)으로 표시한다.

            - 동일하거나 유사한 오류가 여러 시간대에 반복되는지 확인한다.

            - overall_status는 "양호" / "주의" / "조치 필요" 중 하나로만 판단한다.

            - key_findings는 최대 5개, recommendations는 최소 1개 이상 작성한다.

            - 반드시 한국어로 답변한다.


            [최종 응답 직렬화 규칙]

            최종 응답은 아래 JSON Schema를 만족하는 JSON 객체 하나만 출력한다. 코드펜스, 설명, 사고 과정은 JSON 밖에
            출력하지 않는다. 앞에서 요청한 Markdown 분석/보고서는 summary 또는 report_text 필드의 문자열 안에 작성한다.
            모든 필수 필드를 포함하고 boolean은 true/false로 출력한다.

            {"additionalProperties": false, "properties": {"key_findings": {"description":
            "발견된 주요 사항 목록. 실제로 확인된 내용만, 최대 5개", "items": {"type": "string"}, "type":
            "array"}, "overall_status": {"description": "금일 단건분석 결과 종합 판단", "enum":
            ["양호", "주의", "조치 필요"], "type": "string"}, "recommendations": {"description":
            "운영자가 확인/조치해야 할 권고사항. 최소 1개 이상", "items": {"type": "string"}, "type":
            "array"}, "trend_summary": {"description": "시간대별 오류 발생 추이 요약. 확정할 수 없는
            부분은 (추정) 표시", "type": "string"}}, "required": ["overall_status", "trend_summary",
            "key_findings", "recommendations"], "type": "object"}'
        - id: 7f2c9e4a-1b5d-4a8e-9c3f-6d1a8b2e4f70
