        code: "def main(hourly_optimization_json: str) -> dict:\n    import json\n\
          \n    raw = (hourly_optimization_json or \"\").strip()\n\n    if not raw:\n\
          \        return {\n            \"has_data\": \"false\",\n            \"\
          status\": \"empty\",\n            \"error_detail\": \"\",\n            \"\
          hour_count\": 0,\n            \"records_text\": \"\",\n        }\n\n   \
          \ try:\n        records = json.loads(raw)\n        if not isinstance(records,\
          \ list):\n            records = [records]\n    except Exception as e:\n\
          \        return {\n            \"has_data\": \"false\",\n            \"\
          status\": \"error\",\n            \"error_detail\": str(e).replace('\"',\
          \ \"'\").replace(\"\\n\", \" \")[:300],\n            \"hour_count\": 0,\n\
          \            \"records_text\": \"\",\n        }\n\n    if not records:\n\
          \        return {\n            \"has_data\": \"false\",\n            \"\
          status\": \"empty\",\n            \"error_detail\": \"\",\n            \"\
          hour_count\": 0,\n            \"records_text\": \"\",\n        }\n\n   \
