            치명적 패턴 감지 여부


            주의사항

            <LOG_SUMMARY>에 없는 내용은 단정하지 않는다.

            전후 문맥만으로 원인이 명확하지 않으면 반드시 (추정)이라고 표시한다.

            집계 과정에서 상위 그룹(ERROR 15개/WARN 10개) 외의 이슈는 생략되었을 수 있음을 감안하여, 불확실한 부분은 "확인
            필요"로 남긴다.

            오류가 없는 경우에도 빈 응답을 생성하지 않는다.

            이상이 없다면 금일 특이사항 없음이라고 명시한다.

            반드시 SYSTEM에서 정의한 일일보고 출력 형식을 준수한다.'
