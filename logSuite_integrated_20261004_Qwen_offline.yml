    - data:
        code: "def main(monthly_anomaly_json: str) -> dict:\n    import json\n\n \
          \   raw = (monthly_anomaly_json or \"\").strip()\n\n    if not raw:\n  \
          \      return {\"has_data\": \"false\", \"status\": \"empty\", \"error_detail\"\
          : \"\",\n                \"day_count\": 0, \"no_data_day_count\": 0, \"\
          records_text\": \"\"}\n\n    try:\n        records = json.loads(raw)\n \
          \       if not isinstance(records, list):\n            records = [records]\n\
          \    except Exception as e:\n        return {\"has_data\": \"false\", \"\
          status\": \"error\",\n                \"error_detail\": str(e).replace('\"\
          ', \"'\").replace(\"\\n\", \" \")[:300],\n                \"day_count\"\
          : 0, \"no_data_day_count\": 0, \"records_text\": \"\"}\n\n    if not records:\n\
          \        return {\"has_data\": \"false\", \"status\": \"empty\", \"error_detail\"\
          : \"\",\n                \"day_count\": 0, \"no_data_day_count\": 0, \"\
          records_text\": \"\"}\n\n    def sort_key(rec):\n        if isinstance(rec,\
          \ dict):\n            return str(rec.get(\"date\") or rec.get(\"day\") or\
          \ rec.get(\"timestamp\") or \"\")\n        return \"\"\n\n    try:\n   \
          \     records = sorted(records, key=sort_key)\n    except Exception:\n \
          \       pass\n\n    blocks = []\n    no_data_days = 0\n    data_days = 0\n\
          \    for i, rec in enumerate(records, 1):\n        if isinstance(rec, dict):\n\
          \            day = rec.get(\"date\") or rec.get(\"day\") or rec.get(\"timestamp\"\
          ) or f\"{i}일차\"\n            # 그날 자체가 \"집계할 hourly anomaly 데이터가 없었던 날\"\
          이면 인사이트로 취급하지 않고\n            # 데이터 없는 날 수만 별도로 센다 (정상으로 오인하지 않도록).\n  \
          \          if rec.get(\"status\") == \"no_data\":\n                no_data_days\
          \ += 1\n                continue\n            insight = rec.get(\"insight\"\
          )\n            if insight not in (None, {}, \"\"):\n                detail\
          \ = json.dumps(insight, ensure_ascii=False)\n            else:\n       \
          \         rest = {k: v for k, v in rec.items() if k not in (\"date\", \"\
          day\", \"timestamp\", \"status\")}\n                detail = json.dumps(rest,\
          \ ensure_ascii=False)\n            blocks.append(f\"[{i}] 일자: {day}\\n \
          \ 내용: {detail[:2000]}\")\n            data_days += 1\n        else:\n  \
          \          blocks.append(f\"[{i}] {str(rec)[:2000]}\")\n            data_days\
          \ += 1\n\n    records_text = \"\\n\\n\".join(blocks)\n    if len(records_text)\
          \ > 30000:\n        records_text = records_text[:30000] + f\"\\n...(이하 생략,\
          \ 총 {data_days}일 중 일부 내용은 축약됨)\"\n\n    if data_days == 0:\n        return\
          \ {\"has_data\": \"false\", \"status\": \"empty\", \"error_detail\": \"\"\
          ,\n                \"day_count\": 0, \"no_data_day_count\": no_data_days,\
          \ \"records_text\": \"\"}\n\n    return {\"has_data\": \"true\", \"status\"\
          : \"ok\", \"error_detail\": \"\",\n            \"day_count\": data_days,\
          \ \"no_data_day_count\": no_data_days, \"records_text\": records_text}\n"
        code_language: python3
        desc: 한 달치 daily_anomaly_daily_result(JSON 배열)를 파싱하여 LLM 입력용 텍스트를 만든다
        outputs:
          day_count:
            children: null
            type: number
          error_detail:
            children: null
            type: string
          has_data:
            children: null
            type: string
          no_data_day_count:
            children: null
            type: number
          records_text:
            children: null
            type: string
          status:
            children: null
            type: string
