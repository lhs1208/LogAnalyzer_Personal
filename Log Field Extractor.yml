          MSG_KEYS = {\"message\", \"msg\", \"text\", \"event\", \"body\", \"content\"\
          , \"log\"}\n\nNOISE_RULES = [\n    (\"separator\", r\"^[\\s\\-=_*#~+.]{5,}$\"\
          ),\n    (\"blank_ish\", r\"^\\W{0,3}$\"),\n    (\"stack_frame\", r\"^\\\
          s*(at\\s+\\S+\\(.*\\)|Caused by:|Suppressed:|\\.{3}\\s*\\d+\\s+more)\"),\n\
          \    (\"gc_log\", r\"(^\\[?\\s*(Full\\s+)?GC\\b|\\bAllocation Failure\\\
          b|\\bPSYoungGen\\b)\"),\n    (\"jvm_banner\", r\"^(OpenJDK|Java HotSpot|Picked\
          \ up JAVA)\"),\n    (\"ascii_art\", r\"^\\s*[|/\\\\_:.=]{2,}\"),\n    (\"\
          indented_continuation\", r\"^\\s{2,}\\S\"),\n    (\"sql_fragment\", r\"\
          ^\\s*(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|JOIN)\\b\"),\n]\nNOISE_COMPILED\
          \ = [(n, re.compile(p, re.I)) for n, p in NOISE_RULES]\n\nTOKEN_RE = re.compile(r'\\\
          [[^\\]]*\\]|\"[^\"]*\"|\\([^)]*\\)|\\{[^}]*\\}|\\S+')\nKV_RE = re.compile(r'([A-Za-z_][\\\
          w.\\-]*)=(\"[^\"]*\"|\\'[^\\']*\\'|[^\\s,;]+)')\nIP_RE = re.compile(r\"\
          ^\\d{1,3}(?:\\.\\d{1,3}){3}$\")\nUUID_RE = re.compile(r\"^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$\"\
          )\nHEXID_RE = re.compile(r\"^[0-9a-fA-F]{16,}$\")\nNUM_RE = re.compile(r\"\
          ^\\d+$\")\nFLOAT_RE = re.compile(r\"^-?\\d+\\.\\d+$\")\nDUR_RE = re.compile(r\"\
          ^\\d+(?:\\.\\d+)?(ms|s|us|ns|m)$\")\nURL_RE = re.compile(r\"^https?://\\\
          S+$\")\nPATH_RE = re.compile(r\"^/\\S*$\")\nMETHOD_RE = re.compile(r\"^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS|TRACE|CONNECT)$\"\
          )\nHTTPVER_RE = re.compile(r\"^HTTP/\\d\\.\\d$\")\n# Java 로거 이름 (예: org.apache.catalina.core.StandardContext,\
          \ ...reload)\nLOGGER_RE = re.compile(r\"^[A-Za-z_][\\w$]*(?:\\.[A-Za-z_][\\\
          w$]*){2,}$\")\n\nSENTINEL = \"\\x00TS\\x00\"\nHARD_LINE_CAP = 20000\nMAX_EVENTS\
          \ = 3000\nMAX_GROUPS = 8\nMAX_VARIANTS = 8\nWINDOW = 12\nMAX_JSON_KEYS =\
          \ 80\nMAX_JSON_DEPTH = 4\nOPTIONAL_SAFE = {\"BR\", \"QT\", \"PR\", \"LV\"\
          , \"IP\", \"NM\", \"TS\"}\nJACCARD_MIN = 0.3\n\n\n# ================= 공통\
          \ =================\ndef pick_ts(lines):\n    best = None\n    for name,\
          \ pat, fmt in TS_PATTERNS:\n        rx = re.compile(pat)\n        hits =\
          \ sum(1 for l in lines if rx.search(l))\n        if hits == 0:\n       \
          \     continue\n        c = {\"name\": name, \"regex\": pat, \"strptime\"\
          : fmt,\n             \"coverage\": round(hits / len(lines), 4)}\n      \
          \  if best is None or c[\"coverage\"] > best[\"coverage\"]:\n          \
          \  best = c\n    return best\n\n\n# 진짜 연속 라인의 표지. 타임스탬프가 없다는 이유만으로 병합하면\n\
          # 다른 포맷의 이벤트(JSON 로그 등)까지 앞 줄에 삼켜버린다.\nCONT_RE = re.compile(r\"^(?:\\s+\\\
          S|at\\s+\\S+\\(|Caused by:|Suppressed:|\\.{3}\\s*\\d+\\s+more)\")\n\n\n\
          def merge_multiline(lines, ts):\n    if not ts:\n        return lines, 0\n\
          \    anchor = re.compile(r\"^\\s*(?:<\\d{1,3}>)?\" + ts[\"regex\"])\n  \
          \  if sum(1 for l in lines if anchor.match(l)) < 0.5 * len(lines):\n   \
          \     return lines, 0\n    events, merged = [], 0\n    for l in lines:\n\
          \        cont = (events and not anchor.match(l)\n                and CONT_RE.match(l)\n\
          \                and structure_of(l) == \"plain\")\n        if cont:\n \
          \           events[-1] += \"\\n\" + l\n            merged += 1\n       \
          \ else:\n            events.append(l)\n    return events, merged\n\n\ndef\
          \ stratify(events, cap):\n    \"\"\"앞부분 편향을 피해 전 구간에서 균등 추출\"\"\"\n    if\
          \ len(events) <= cap:\n        return events, False\n    step = len(events)\
          \ / float(cap)\n    return [events[int(i * step)] for i in range(cap)],\
          \ True\n\n\ndef unquote(v):\n    v = v.strip()\n    if len(v) >= 2 and v[0]\
          \ == v[-1] and v[0] in \"\\\"'\":\n        return v[1:-1]\n    return v\n\
          \n\ndef strip_wrap(v):\n    if len(v) >= 2 and v[0] in \"[({\\\"\" and v[-1]\
          \ in \"])}\\\"\":\n        return v[1:-1]\n    return v\n\n\ndef leaf(key):\n\
          \    return (key or \"\").split(\".\")[-1].lower().lstrip(\"@\")\n\n\ndef\
          \ infer_role(values, key, ts_regex):\n    vals = [str(v) for v in values\
          \ if str(v).strip() != \"\"][:20]\n    if not vals:\n        return \"unknown\"\
          , \"string\"\n    k = leaf(key)\n    if k in TS_KEYS:\n        return \"\
          timestamp\", \"datetime\"\n    if k in LEVEL_KEYS:\n        return \"level\"\
          , \"string\"\n    if k in MSG_KEYS:\n        return \"message\", \"string\"\
          \n\n    def every(rx):\n        return all(rx.match(v) for v in vals)\n\n\
          \    if ts_regex and all(re.fullmatch(ts_regex, v) for v in vals):\n   \
          \     return \"timestamp\", \"datetime\"\n    if all(v.upper().strip(\"\
          []:\") in LEVEL_SET for v in vals):\n        return \"level\", \"string\"\
          \n    if every(METHOD_RE):\n        return \"http_method\", \"string\"\n\
          \    if every(HTTPVER_RE):\n        return \"http_version\", \"string\"\n\
          \    if every(IP_RE):\n        return \"client_ip\", \"ip\"\n    if every(UUID_RE):\n\
          \        return \"trace_id\", \"string\"\n    if every(HEXID_RE):\n    \
          \    return \"hex_id\", \"string\"\n    if every(URL_RE):\n        return\
          \ \"url\", \"string\"\n    if every(PATH_RE):\n        return \"path\",\
          \ \"string\"\n    if every(DUR_RE):\n        return \"duration\", \"duration\"\
          \n    if every(NUM_RE):\n        nums = [int(v) for v in vals]\n       \
          \ if len(vals[0]) == 3 and all(100 <= x <= 599 for x in nums) \\\n     \
          \           and len(set(len(v) for v in vals)) == 1:\n            return\
          \ \"http_status\", \"int\"\n        if k in (\"port\", \"sport\", \"dport\"\
          ) and all(0 < x < 65536 for x in nums):\n            return \"port\", \"\
          int\"\n        return \"number\", \"int\"\n    if every(FLOAT_RE):\n   \
          \     return \"number\", \"float\"\n    if every(LOGGER_RE):\n        return\
          \ \"logger\", \"string\"\n    return \"unknown\", \"string\"\n\n\ndef classify(tok):\n\
          \    if tok == SENTINEL:\n        return \"TS\"\n    bare = tok.strip(\"\
          []:\")\n    # 대문자 전체거나 소문자 전체인 경우만 레벨로 본다. \"Error\", \"Warning\" 처럼\n \
          \   # 평범한 문장에 나오는 Title-case 단어와 혼동되는 것을 막기 위함이다\n    # (실제 로그레벨 표기는 거의\
          \ 항상 전부 대문자거나 전부 소문자다).\n    if bare and (bare.isupper() or bare.islower())\
          \ and bare.upper() in LEVEL_SET:\n        return \"LV\"\n    if tok.startswith(\"\
          [\") and tok.endswith(\"]\"):\n        return \"BR\"\n    if tok.startswith('\"\
          ') and tok.endswith('\"'):\n        return \"QT\"\n    if tok.startswith(\"\
          (\") and tok.endswith(\")\"):\n        return \"PR\"\n    if IP_RE.match(tok):\n\
          \        return \"IP\"\n    if NUM_RE.match(tok):\n        return \"NM\"\
          \n    return \"WD\"\n\n\ndef tokenize(event, ts_regex):\n    first = event.split(\"\
          \\n\")[0]\n    work, ts_val = first, None\n    if ts_regex:\n        m =\
          \ re.search(ts_regex, first)\n        if m:\n            ts_val = m.group(0)\n\
          \            work = first[:m.start()] + SENTINEL + first[m.end():]\n   \
          \ toks = TOKEN_RE.findall(work)\n    return toks, [classify(t) for t in\
          \ toks], ts_val\n\n\ndef noise_kind(event):\n    first = event.split(\"\\\
          n\")[0]\n    for name, rx in NOISE_COMPILED:\n        if rx.search(first):\n\
          \            return name\n    return None\n\n\ndef good_turing(counter,\
          \ n):\n    \"\"\"1회만 관측된 변형 비율 = 다음 관측이 미관측 변형일 확률의 추정치\"\"\"\n    if not\
          \ n:\n        return 0.0\n    singles = sum(1 for v in counter.values()\
          \ if v == 1)\n    return round(min(singles / float(n), 1.0), 4)\n\n\n# =================\
          \ 구조 판별 =================\ndef structure_of(line):\n    s = line.strip()\n\
          \    if s.startswith(\"{\") and s.endswith(\"}\"):\n        try:\n     \
          \       if isinstance(json.loads(s), dict):\n                return \"json\"\
          \n        except Exception:\n            pass\n    # 구조 판별은 이벤트의 첫 줄만 본다.\
          \ 멀티라인 병합 후 전체 텍스트를 보면\n    # 스택트레이스 들여쓰기(tab 등)가 누적되어 delimited 로 오판된다.\n\
          \    first = s.split(\"\\n\", 1)[0]\n    if re.match(r\"^<\\d{1,3}>1\\s\"\
          , first):\n        return \"syslog5424\"\n    if len(KV_RE.findall(first))\
          \ >= 3 and len(first.split(\"=\")[0].split()) <= 3:\n        return \"logfmt\"\
          \n    for d in [\"\\t\", \"|\", \";\"]:\n        if first.count(d) >= 3:\n\
          \            return \"delimited:\" + d\n    if first.count(\",\") >= 3 and\
          \ '\"' not in first and \" - \" not in first:\n        return \"delimited:,\"\
          \n    return \"plain\"\n\n\n# ================= JSON / logfmt / delimited\
          \ / syslog =================\ndef flatten(obj, prefix=\"\", out=None, depth=0):\n\
          \    if out is None:\n        out = {}\n    for k, v in obj.items():\n \
          \       if len(out) >= MAX_JSON_KEYS:\n            return out\n        key\
          \ = prefix + str(k)\n        if isinstance(v, dict) and depth < MAX_JSON_DEPTH:\n\
          \            flatten(v, key + \".\", out, depth + 1)\n        elif isinstance(v,\
          \ dict):\n            out[key] = json.dumps(v, ensure_ascii=False)[:200]\n\
          \        elif isinstance(v, list):\n            if v and all(not isinstance(x,\
          \ (dict, list)) for x in v):\n                out[key] = \",\".join(str(x)\
          \ for x in v)[:200]\n            else:\n                out[key + \"[]\"\
          ] = json.dumps(v, ensure_ascii=False)[:200]\n        else:\n           \
          \ out[key] = v\n    return out\n\n\ndef extract_json(events, ts_regex):\n\
          \    objs, truncated, keysig = [], False, {}\n    for e in events:\n   \
          \     try:\n            o = json.loads(e.strip())\n            if isinstance(o,\
          \ dict):\n                fl = flatten(o)\n                if len(fl) >=\
          \ MAX_JSON_KEYS:\n                    truncated = True\n               \
          \ objs.append(fl)\n                sk = tuple(sorted(fl.keys()))\n     \
          \           keysig[sk] = keysig.get(sk, 0) + 1\n        except Exception:\n\
          \            pass\n    keys = []\n    for o in objs:\n        for k in o.keys():\n\
          \            if k not in keys:\n                keys.append(k)\n    fields\
          \ = []\n    for i, k in enumerate(keys, 1):\n        vals = [o[k] for o\
          \ in objs if k in o]\n        role, typ = infer_role(vals, k, ts_regex)\n\
          \        fields.append({\"index\": i, \"source\": k, \"json_path\": k,\n\
          \                       \"name\": k.replace(\".\", \"_\").replace(\"[]\"\
          , \"_arr\"),\n                       \"role\": role, \"type\": typ,\n  \
          \                     \"nullable\": len(vals) < len(objs),\n           \
          \            \"nested\": \".\" in k,\n                       \"examples\"\
          : [str(v)[:80] for v in vals[:2]]})\n    spec = {\"parser\": \"json\", \"\
          regex\": None, \"variants\": [], \"fields\": fields,\n            \"flatten\"\
          : {\"separator\": \".\", \"max_depth\": MAX_JSON_DEPTH},\n            \"\
          unseen_variant_rate\": good_turing(keysig, len(objs)),\n            \"selector\"\
          : {\"kind\": \"json_object\"}}\n    if truncated:\n        spec[\"note\"\
          ] = \"키가 %d개를 넘어 일부만 반영했습니다\" % MAX_JSON_KEYS\n    return spec\n\n\ndef\
          \ extract_logfmt(events, ts_regex):\n    keys, bag, keysig = [], {}, {}\n\
          \    for e in events:\n        pairs = KV_RE.findall(e)\n        keysig[tuple(sorted(k\
          \ for k, _ in pairs))] = \\\n            keysig.get(tuple(sorted(k for k,\
          \ _ in pairs)), 0) + 1\n        for k, v in pairs:\n            if k not\
          \ in keys:\n                keys.append(k)\n            bag.setdefault(k,\
          \ []).append(unquote(v))\n    fields = []\n    for i, k in enumerate(keys,\
          \ 1):\n        role, typ = infer_role(bag[k], k, ts_regex)\n        fields.append({\"\
          index\": i, \"source\": k, \"name\": k, \"role\": role,\n              \
          \         \"type\": typ, \"nullable\": len(bag[k]) < len(events),\n    \
          \                   \"examples\": bag[k][:2]})\n    return {\"parser\":\
          \ \"logfmt\", \"regex\": None, \"variants\": [], \"fields\": fields,\n \
          \           \"unseen_variant_rate\": good_turing(keysig, len(events)),\n\
          \            \"selector\": {\"kind\": \"kv_pairs\", \"min_pairs\": 3}}\n\
          \n\ndef extract_delimited(events, delim, ts_regex):\n    rows = [e.split(delim)\
          \ for e in events]\n    ncol = max(len(r) for r in rows)\n    header = None\n\
          \    if len(rows) >= 3:\n        h = [c.strip() for c in rows[0]]\n    \
          \    rest_num = any(NUM_RE.match(c.strip()) for r in rows[1:] for c in r)\n\
          \        if len(set(h)) == len(h) and not any(NUM_RE.match(c) for c in h)\
          \ and rest_num:\n            header, rows = h, rows[1:]\n    colsig = {}\n\
          \    for r in rows:\n        colsig[len(r)] = colsig.get(len(r), 0) + 1\n\
          \    fields = []\n    for i in range(ncol):\n        vals = [r[i].strip()\
